name: Bug Report
description: Report a bug in ZoomCast
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce and expected behavior.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: macOS version & Mac model
      placeholder: "e.g. macOS 15.2, Apple M2"
    validations:
      required: true
